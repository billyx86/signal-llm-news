<style>
:root{--ink-950:#0c0d0f;--ink-900:#12141a;--ink-800:#1a1d26;--ink-700:#252a36;--ink-600:#3a4152;--ink-500:#5c6478;--ink-400:#8b93a7;--ink-300:#b8bfcf;--ink-200:#d8dce6;--ink-100:#eceef3;--ink-50:#f6f7f9;--amber:#e8a317;--amber-soft:#f5c842;--amber-dim:#c4921a;--display:"Newsreader",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:var(--sans);background:var(--ink-950);color:var(--ink-100);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input{font:inherit}::selection{background:rgba(232,163,23,.35);color:var(--ink-50)}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}.font-d{font-family:var(--display)}
header{position:sticky;top:0;z-index:40;border-bottom:1px solid rgba(58,65,82,.6);background:rgba(12,13,15,.9);backdrop-filter:blur(10px)}
.hbar{display:flex;align-items:center;justify-content:space-between;height:3.5rem;gap:1rem}
.brand{display:flex;align-items:center;gap:.65rem}.logo{width:2rem;height:2rem;display:grid;place-items:center;border:1px solid rgba(232,163,23,.4);background:var(--ink-900);color:var(--amber);border-radius:2px;font-size:.85rem}
.brand h1{font-family:var(--display);font-size:1.15rem;margin:0;line-height:1;font-weight:600}.brand p{margin:.15rem 0 0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid rgba(58,65,82,.8);background:var(--ink-900);color:var(--ink-200);padding:.4rem .7rem;border-radius:2px;font-size:.75rem;cursor:pointer;transition:.15s}.btn:hover{border-color:rgba(232,163,23,.4);color:var(--amber-soft)}.btn.on{border-color:rgba(232,163,23,.5);background:rgba(232,163,23,.1);color:var(--amber-soft)}
.badge{min-width:1.1rem;padding:0 .35rem;border-radius:999px;background:rgba(232,163,23,.15);color:var(--amber-soft);font-size:10px;font-weight:600;text-align:center}
main{padding:1.5rem 0 3rem;flex:1}footer{border-top:1px solid rgba(58,65,82,.5);padding:2rem 0;color:var(--ink-500);font-size:.75rem}
.hero-label{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--amber-dim);margin:0 0 .35rem}.page-title{font-family:var(--display);font-size:clamp(1.5rem,3vw,1.9rem);margin:0;font-weight:600;letter-spacing:-.02em}.lede{color:var(--ink-400);font-size:.9rem;max-width:36rem;margin:.5rem 0 0;line-height:1.5}
.filters{margin-top:1.25rem;padding-bottom:1rem;border-bottom:1px solid rgba(58,65,82,.45)}.filters-row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.search{position:relative;flex:1;min-width:12rem;max-width:28rem}input[type=search]{width:100%;background:var(--ink-900);border:1px solid rgba(58,65,82,.7);color:var(--ink-100);padding:.55rem .75rem .55rem 2.1rem;border-radius:2px;outline:none}input[type=search]:focus{border-color:rgba(232,163,23,.5);box-shadow:0 0 0 1px rgba(232,163,23,.3)}.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);opacity:.5;width:14px;height:14px}
.chips{display:flex;gap:.25rem;overflow-x:auto;padding-bottom:2px}.chip{flex-shrink:0;border:1px solid rgba(58,65,82,.6);background:rgba(18,20,26,.6);color:var(--ink-400);padding:.3rem .65rem;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.chip.on{background:var(--amber);border-color:var(--amber);color:var(--ink-950)}.meta{font-size:11px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.08em}
.lead{margin-top:1.75rem;border:1px solid rgba(58,65,82,.5);background:rgba(18,20,26,.4);position:relative;overflow:hidden}.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber)}
.lead-grid{display:grid;gap:1.5rem;padding:1.4rem 1.4rem 1.4rem 1.6rem}@media(min-width:900px){.lead-grid{grid-template-columns:1.4fr 1fr;gap:2.5rem;padding:1.75rem}}
.kicker{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-bottom:.75rem}.pill{background:var(--amber);color:var(--ink-950);padding:.15rem .4rem;border-radius:2px}.kicker .t{color:var(--amber-dim)}.kicker .s{color:var(--ink-400)}
.lead h2{font-family:var(--display);font-size:clamp(1.6rem,3.5vw,2.5rem);line-height:1.15;margin:0;font-weight:600;letter-spacing:-.02em}.lead h2 a:hover{color:var(--amber-soft)}.sum{margin:1rem 0 0;color:var(--ink-300);line-height:1.6;font-size:.95rem;max-width:40rem}
.actions{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;margin-top:1.35rem}.cta{background:var(--ink-50);color:var(--ink-950);border:none;padding:.55rem .9rem;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}.cta:hover{background:var(--amber-soft)}.side{border-top:1px solid rgba(58,65,82,.5);padding-top:1.2rem}@media(min-width:900px){.side{border-top:0;border-left:1px solid rgba(58,65,82,.5);padding:0 0 0 2rem}}.side h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-500);margin:0 0 .5rem}.side p{font-family:var(--display);font-size:1.1rem;line-height:1.35;color:var(--ink-200);margin:0}.side dl{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0 0;font-size:.85rem}.side dt{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-500)}.side dd{margin:.15rem 0 0;font-weight:500;color:var(--ink-200)}
.wire{margin-top:2rem}.wire-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem}.wire-h h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-500);margin:0}
.card{display:flex;gap:.75rem;padding:1rem 0;border-bottom:1px solid rgba(58,65,82,.4)}.card:last-child{border-bottom:0}.card-body{flex:1;min-width:0}.card .k{display:flex;flex-wrap:wrap;gap:.4rem;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);margin-bottom:.4rem}.card .k .t{color:var(--amber-dim)}.card h3{font-family:var(--display);font-size:1.1rem;margin:0;font-weight:600;line-height:1.3;letter-spacing:-.01em}.card h3 a:hover{color:var(--amber-soft)}.card p{margin:.4rem 0 0;color:var(--ink-400);font-size:.875rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm{flex-shrink:0;width:2rem;height:2rem;display:grid;place-items:center;border:1px solid rgba(58,65,82,.6);background:transparent;color:var(--ink-500);border-radius:2px;cursor:pointer}.bm.on{border-color:rgba(232,163,23,.5);background:rgba(232,163,23,.1);color:var(--amber-soft)}
.detail{max-width:48rem}.back{display:inline-flex;align-items:center;gap:.35rem;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);margin-bottom:1.5rem}.back:hover{color:var(--amber-soft)}
.detail h1{font-family:var(--display);font-size:clamp(1.75rem,4vw,2.6rem);line-height:1.12;margin:.5rem 0 0;font-weight:600;letter-spacing:-.02em}
.detail .deck{border-left:2px solid rgba(232,163,23,.7);padding-left:1rem;margin:1.25rem 0;color:var(--ink-300);font-size:1.05rem;line-height:1.55}
.detail .body p{color:var(--ink-200);line-height:1.75;font-size:.975rem;margin:0 0 1.1rem}
.empty{border:1px dashed rgba(58,65,82,.6);padding:3rem 1rem;text-align:center;color:var(--ink-500)}.empty h3{font-family:var(--display);color:var(--ink-300);font-size:1.25rem;margin:0 0 .5rem}
.app{min-height:100vh;display:flex;flex-direction:column}
</style>

<script>
const TOPICS=['Models','Research','Open Source','Policy','Industry','Tools'];
const hoursAgo=h=>new Date(Date.now()-h*3600e3).toISOString();
const stories=[
{id:'openai-o3-reasoning',title:'OpenAI ships o3 with stepwise reasoning that outscores human experts on ARC-AGI',summary:'The long-awaited o3 system scores 87.5% on ARC-AGI under competition conditions, with a high-compute mode nearing 96%. OpenAI frames it as a step toward deliberate, tool-using agents rather than a raw scale win.',body:'OpenAI unveiled o3, a reasoning-first model family that spends variable compute at inference time to plan, check, and revise answers before responding.\n\nOn the ARC-AGI public evaluation, o3 hit 87.5% in the low-compute setting and approached 96% when allowed substantially more inference budget. That puts it past typical human baselines on a benchmark long treated as a stubborn measure of fluid intelligence.\n\nUnlike pure next-token models, o3 is trained to produce internal chains of thought and to use tools when they improve accuracy. OpenAI says the system is designed for scientific research, software engineering, and multi-step agent workflows rather than casual chat.\n\nAccess will roll out first to API safety partners and ChatGPT Pro, with broader tiers expected as capacity and cost come down. Safety evaluations focused on biological risk, cyber offense, and deceptive behavior under long-horizon planning.',topic:'Models',source:'OpenAI',sourceUrl:'https://openai.com',author:'Research Desk',publishedAt:hoursAgo(3),featured:true,readTime:6},
{id:'anthropic-claude-4-sonnet',title:'Anthropic launches Claude 4 Sonnet with computer use and stronger coding benchmarks',summary:'Claude 4 Sonnet leads several software engineering leaderboards while expanding desktop computer-use capabilities. Anthropic emphasizes hybrid reasoning modes that trade latency for depth.',body:'Anthropic released Claude 4 Sonnet, positioning it as a workhorse model for coding, analysis, and agentic desktop control.\n\nThe model posts competitive scores on SWE-bench Verified and internal multi-file refactor suites. Computer use—screen observation plus mouse and keyboard actions—moves from research preview to a supported product surface.\n\nA hybrid reasoning mode lets developers request short or extended internal deliberation depending on task difficulty. Anthropic says this cuts average latency on easy prompts while preserving depth for hard ones.\n\nEnterprise customers get improved artifacts, projects, and admin controls. Pricing remains aligned with prior Sonnet tiers, with higher rate limits for Team and Enterprise plans.',topic:'Models',source:'Anthropic',sourceUrl:'https://anthropic.com',author:'Product Desk',publishedAt:hoursAgo(5),readTime:5},
{id:'deepseek-r1-open',title:'DeepSeek R1 goes fully open-weight, matching frontier reasoning at a fraction of cost',summary:'Chinese lab DeepSeek open-sourced R1 under a permissive license. Independent evals show strong math and code performance with distillation recipes that fit mid-size GPUs.',body:'DeepSeek released R1 as open weights, alongside distilled variants that preserve much of the parent model\'s reasoning quality at 7B–32B scales.\n\nCommunity evals on AIME, MATH, and LiveCodeBench put R1 near closed frontier systems while training and inference costs remain dramatically lower. The release includes training notes on reinforcement learning from verifiable rewards.\n\nResearchers are already fine-tuning R1 distillations for domain agents. Cloud providers raced to host endpoints within hours of the drop.\n\nThe move intensifies pressure on closed labs to justify proprietary barriers when open recipes approach parity on core reasoning tasks.',topic:'Open Source',source:'DeepSeek',sourceUrl:'https://github.com/deepseek-ai',author:'Open Source Desk',publishedAt:hoursAgo(8),readTime:4},
{id:'meta-llama-4',title:'Meta previews Llama 4 Scout and Maverick with native multimodality',summary:'Llama 4 introduces mixture-of-experts architectures and first-class image understanding. Meta pledges continued open release under an updated community license.',body:'Meta\'s Llama 4 family arrives in two flavors: Scout for efficient multimodal work and Maverick for larger-context reasoning.\n\nBoth models use mixture-of-experts routing to keep active parameters low relative to total capacity. Native vision training replaces bolted-on adapters used in earlier Llama generations.\n\nContext windows stretch to multi-million tokens in flagship configs, aimed at codebase ingestion and long document agents. Meta says safety fine-tunes and system-level filters ship with the weights.\n\nEarly partners include cloud hyperscalers and device OEMs exploring on-device variants.',topic:'Models',source:'Meta AI',sourceUrl:'https://ai.meta.com',author:'Models Desk',publishedAt:hoursAgo(11),readTime:5},
{id:'google-gemini-2-5',title:'Google DeepMind ships Gemini 2.5 Pro with adaptive thinking budgets',summary:'Gemini 2.5 Pro exposes controllable thinking tokens and tops several multimodal leaderboards. Google integrates it across AI Studio, Vertex, and Android Gemini.',body:'Google DeepMind released Gemini 2.5 Pro with an explicit thinking budget developers can dial up or down per request.\n\nThe model leads on GPQA Diamond and several video understanding suites. Deep integration with Search grounding and Maps tools targets research and planning agents.\n\nVertex AI customers get batch APIs and context caching discounts. Consumer Gemini apps gain deeper Canvas-style collaboration features.\n\nGoogle frames adaptive thinking as a way to compete on quality without always paying peak inference cost.',topic:'Models',source:'Google DeepMind',sourceUrl:'https://deepmind.google',author:'Industry Desk',publishedAt:hoursAgo(14),readTime:4},
{id:'mistral-small-3',title:'Mistral Small 3.1 delivers Apache-2.0 weights competitive with GPT-4o mini',summary:'Paris-based Mistral continues its open-weight cadence with a 24B-class model tuned for low latency. Licensing stays fully permissive for commercial use.',body:'Mistral AI released Small 3.1 under Apache 2.0, emphasizing speed, multilingual quality, and function calling.\n\nIndependent latency tests show single-digit token times on a single H100 for short prompts. Coding and instruction following approach larger closed mini models.\n\nThe company also updated its Le Chat product with projects and web search. Enterprise on-prem deployments remain a core sales motion in Europe.\n\nOpen weights plus permissive licensing continue to differentiate Mistral against more restrictive community licenses.',topic:'Open Source',source:'Mistral AI',sourceUrl:'https://mistral.ai',author:'Open Source Desk',publishedAt:hoursAgo(18),readTime:3},
{id:'eu-ai-act-gpa',title:'EU AI Act codes of practice for general-purpose models enter enforcement window',summary:'Providers of systemic GPAI models face transparency, copyright, and risk reporting duties. Brussels published final codes after months of industry negotiation.',body:'The European Commission confirmed that codes of practice for general-purpose AI models now guide enforcement under the AI Act.\n\nObligations cover training data summaries, copyright compliance policies, energy disclosures, and systemic risk assessments for the largest models.\n\nUS and Chinese labs with EU users must appoint representatives and document evaluation procedures. Fines can reach a percentage of global turnover for serious non-compliance.\n\nIndustry groups welcomed clearer templates but warned that watermarking and data provenance requirements remain technically immature.',topic:'Policy',source:'European Commission',sourceUrl:'https://digital-strategy.ec.europa.eu',author:'Policy Desk',publishedAt:hoursAgo(20),readTime:5},
{id:'nvidia-blackwell-ultra',title:'NVIDIA unveils Blackwell Ultra racks aimed at multi-trillion parameter training',summary:'New GB300-class systems promise major jumps in FP4 throughput and NVLink domain size. Cloud providers line up 2026 capacity reservations.',body:'NVIDIA detailed Blackwell Ultra configurations that scale NVLink domains and raise dense FP4 performance for mixture-of-experts training.\n\nLiquid-cooled racks target hyperscalers building clusters beyond 100,000 GPUs. Software updates to CUDA, NCCL, and Megatron-LM accompany the silicon.\n\nMicrosoft, Google, Amazon, and Oracle announced multi-year purchase frameworks. Power delivery and data center siting remain the binding constraints, not chip supply alone.\n\nNVIDIA also expanded NIM microservices for enterprise inference of popular open models.',topic:'Industry',source:'NVIDIA',sourceUrl:'https://nvidia.com',author:'Industry Desk',publishedAt:hoursAgo(22),readTime:4},
{id:'xai-grok-3',title:'xAI\'s Grok 3 emphasizes real-time search and large-scale pretraining on Colossus',summary:'Trained on the Memphis supercluster, Grok 3 targets frontier chat and agent use cases inside X and the xAI API.',body:'xAI released Grok 3 after training runs on its Colossus cluster, claiming competitive results on math, coding, and general knowledge.\n\nDeepSearch-style modes pull live web and X data into answers. Voice and image understanding expand the consumer Grok app.\n\nAPI pricing undercuts several peers for high-volume chat workloads. xAI says subsequent Grok versions will focus on tool use and long-horizon agents.\n\nThe release keeps pressure on a crowded frontier market where differentiation increasingly comes from product surfaces, not raw benchmark deltas alone.',topic:'Models',source:'xAI',sourceUrl:'https://x.ai',author:'Models Desk',publishedAt:hoursAgo(26),readTime:4},
{id:'stanford-helm-update',title:'Stanford HELM expands multilingual and agentic evaluation suites',summary:'The Center for Research on Foundation Models overhauled HELM with scenario packs for tool use, long context, and low-resource languages.',body:'Stanford CRFM updated HELM to better reflect how models are used in production agent stacks.\n\nNew scenarios cover multi-step tool calling, document-grounded QA over 100k+ tokens, and evaluation in 20+ languages beyond English-centric suites.\n\nLeaderboards now surface cost-normalized scores so smaller efficient models can be compared fairly against larger ones.\n\nAcademic and industry labs can submit runs via a standardized harness, improving reproducibility of public claims.',topic:'Research',source:'Stanford CRFM',sourceUrl:'https://crfm.stanford.edu',author:'Research Desk',publishedAt:hoursAgo(30),readTime:4},
{id:'hf-smolagents',title:'Hugging Face open-sources smolagents for minimal multi-step tool loops',summary:'A lightweight Python library shows strong agent results with surprisingly small models when the scaffold is right.',body:'Hugging Face released smolagents, a minimal framework for code-writing agents that call tools in a tight loop.\n\nBenchmarks suggest that scaffolding quality often matters more than raw model size for many enterprise workflows. The library ships with secure local code execution options.\n\nExamples include research assistants, data cleaning bots, and browser controllers. Integration with the Hub model catalog is first-class.\n\nThe project continues HF\'s push to commoditize agent plumbing rather than only model hosting.',topic:'Tools',source:'Hugging Face',sourceUrl:'https://huggingface.co',author:'Tools Desk',publishedAt:hoursAgo(34),readTime:3},
{id:'openai-operator',title:'OpenAI Operator agents start booking and shopping in limited preview',summary:'Computer-use agents move from demos to constrained consumer tasks. Safety layers require confirmation on payments and account changes.',body:'OpenAI\'s Operator product enters limited preview, letting agents navigate websites to complete errands like reservations and product research.\n\nUsers supervise via a remote browser view and must approve sensitive actions. OpenAI reports lower error rates after training on synthetic trajectories and human feedback.\n\nPartners include travel and retail sites that expose clearer DOM semantics. Critics worry about credential handling and dark-pattern exploitation.\n\nThe preview is US-only for Pro subscribers initially.',topic:'Tools',source:'OpenAI',sourceUrl:'https://openai.com',author:'Tools Desk',publishedAt:hoursAgo(38),readTime:4},
{id:'microsoft-phi-4',title:'Microsoft Phi-4-reasoning proves small models can punch up with targeted RL',summary:'New Phi variants focus on math and scientific reasoning while staying deployable on a single consumer GPU.',body:'Microsoft Research released Phi-4 reasoning-oriented checkpoints that rival much larger models on contest math after reinforcement learning on verified solutions.\n\nThe models target edge and copilot scenarios where latency and cost dominate. Azure AI Foundry hosts managed endpoints; weights are available for local use under Microsoft\'s license.\n\nPhi continues to influence the industry narrative that data quality and post-training can substitute for pure parameter count.\n\nDevelopers report strong results when Phi is used as a specialist inside multi-model router systems.',topic:'Research',source:'Microsoft Research',sourceUrl:'https://www.microsoft.com/research',author:'Research Desk',publishedAt:hoursAgo(42),readTime:4},
{id:'us-export-controls',title:'US expands chip export controls with new diffusion rules for closed-weight models',summary:'Updated rules tighten GPU shipments and introduce reporting for large closed model weights. Allies coordinate licensing regimes.',body:'The US Commerce Department issued revised export controls covering advanced AI accelerators and certain closed-weight model releases.\n\nCompanies must report training runs above defined compute thresholds and restrict weight transfers to listed entities. Allied countries are aligning license exceptions.\n\nIndustry counsel say compliance costs will rise for multinational labs with mixed open/closed portfolios. Open-weight releases below thresholds remain largely unrestricted.\n\nThe policy aims to slow military-relevant AI diffusion without freezing commercial innovation—a balance critics on both sides dispute.',topic:'Policy',source:'US Commerce',sourceUrl:'https://www.bis.gov',author:'Policy Desk',publishedAt:hoursAgo(48),readTime:5},
{id:'cursor-agent',title:'Cursor ships multi-file agent mode that plans, edits, and runs tests in-loop',summary:'The AI code editor\'s agent can open terminals, fix failing tests, and propose multi-file diffs with human checkpoints.',body:'Anysphere\'s Cursor editor launched an agent mode that plans tasks, edits across a repository, and executes tests until green or blocked.\n\nDevelopers set budgets for steps and tool calls. Diffs remain reviewable before apply. Support for custom model endpoints continues.\n\nEarly users report big gains on mechanical refactors and flaky test hunts, with weaker results on ambiguous product design work.\n\nThe release intensifies competition among AI-native IDEs and plugin ecosystems.',topic:'Tools',source:'Cursor',sourceUrl:'https://cursor.com',author:'Tools Desk',publishedAt:hoursAgo(52),readTime:3},
{id:'stability-sv4d',title:'Stability AI open-sources SV4D 2.0 for multi-view video generation',summary:'The new model generates consistent multi-camera video from a single clip, aimed at VFX and 3D pipelines.',body:'Stability AI released SV4D 2.0 weights and inference code for multi-view video synthesis.\n\nGiven one video, the model hallucinates additional camera angles with improved temporal consistency over prior versions. Downstream tools convert outputs into rough NeRF or Gaussian splat assets.\n\nLicensing targets research and commercial creative studios. GPU memory requirements remain high but fit dual-24GB setups with tiling.\n\nOpen video models continue to close the gap on closed cinematic systems for specific production tasks.',topic:'Open Source',source:'Stability AI',sourceUrl:'https://stability.ai',author:'Open Source Desk',publishedAt:hoursAgo(56),readTime:3},
{id:'apple-apple-intelligence',title:'Apple Intelligence expands EU rollout after DMA negotiations',summary:'On-device and Private Cloud Compute features reach more iOS markets. Apple details third-party model hooks for Siri.',body:'Apple began a wider EU launch of Apple Intelligence features after addressing Digital Markets Act concerns.\n\nWriting tools, notification summaries, and visual intelligence land first; deeper Siri agent features follow. Private Cloud Compute transparency reports expand.\n\nDevelopers get App Intents hooks so Siri can invoke third-party actions with user permission. Apple still limits full system-wide alternatives to its stack.\n\nThe staggered launch shows how platform AI is increasingly shaped by regional regulation.',topic:'Industry',source:'Apple',sourceUrl:'https://apple.com',author:'Industry Desk',publishedAt:hoursAgo(60),readTime:4},
{id:'berkeley-r1-distill',title:'Berkeley researchers map how reasoning distills from huge RL models into tiny students',summary:'A new paper quantifies which chain-of-thought patterns transfer when distilling R1-class teachers into 1–8B students.',body:'UC Berkeley researchers published a study on reasoning distillation, measuring which supervision signals preserve multi-step accuracy.\n\nKey findings: process rewards and verified final answers both help, but diversity of intermediate strategies matters more than length alone. Over-pruned traces hurt out-of-domain transfer.\n\nThe work includes open datasets of filtered traces and student checkpoints. Labs using distillation for edge deployment are already adopting the recipes.\n\nThe paper reframes small-model gains as curriculum design problems rather than pure compression.',topic:'Research',source:'UC Berkeley',sourceUrl:'https://arxiv.org',author:'Research Desk',publishedAt:hoursAgo(64),readTime:5},
{id:'cohere-command-a',title:'Cohere Command A targets enterprise RAG with 111B efficient MoE',summary:'Optimized for retrieval-augmented generation and multilingual business workflows, Command A emphasizes citation fidelity.',body:'Cohere launched Command A, a mixture-of-experts model tuned for grounded enterprise generation.\n\nBenchmarks focus on citation correctness, refusal quality, and tool use rather than pure chat eloquence. North and multilingual retrieval packs ship with the API.\n\nPrivate deployment options on customer VPC remain a differentiator for regulated industries. Pricing is competitive for high-volume support and knowledge assistants.\n\nCohere continues to court enterprises wary of sending data to consumer-oriented frontier labs.',topic:'Industry',source:'Cohere',sourceUrl:'https://cohere.com',author:'Industry Desk',publishedAt:hoursAgo(70),readTime:3},
{id:'uk-aisi-testing',title:'UK AI Safety Institute publishes cross-lab pre-deployment testing protocol',summary:'Shared eval templates cover cyber, bio, and autonomy risks. Multiple frontier labs agree to pilot participation.',body:'The UK AI Safety Institute released a protocol for pre-deployment testing of highly capable models.\n\nScenarios include autonomous cyber intrusion attempts, biological knowledge uplift, and deception under pressure. Labs can run private tests with optional third-party observers.\n\nResults remain confidential by default, with aggregate public reporting. Civil society groups want stronger disclosure mandates.\n\nThe protocol is designed to interoperate with US and EU reporting regimes where possible.',topic:'Policy',source:'UK AISI',sourceUrl:'https://www.aisi.gov.uk',author:'Policy Desk',publishedAt:hoursAgo(74),readTime:4},
{id:'langchain-langgraph',title:'LangGraph 1.0 stabilizes durable agent workflows with time-travel debugging',summary:'Production agent graphs get checkpointing, human-in-the-loop interrupts, and replay tooling as first-class features.',body:'LangChain\'s LangGraph hit 1.0 with APIs for durable execution of multi-actor agent graphs.\n\nCheckpoints allow recovery after failures and “time travel” to prior states when debugging bad tool calls. Human approval nodes pause execution until review.\n\nCloud SaaS and self-hosted options support streaming UIs. The ecosystem of prebuilt graph templates continues to grow.\n\nStability promises matter for enterprises that stalled on pre-1.0 breaking changes.',topic:'Tools',source:'LangChain',sourceUrl:'https://langchain.com',author:'Tools Desk',publishedAt:hoursAgo(80),readTime:3},
{id:'amazon-nova',title:'Amazon Nova models deepen Bedrock integration with multimodal fine-tuning',summary:'Nova Pro and Lite add cheaper document and image understanding paths for AWS customers.',body:'AWS expanded Amazon Nova model capabilities inside Bedrock, including multimodal fine-tuning and tighter IAM controls.\n\nNova aims at cost-sensitive production workloads that previously defaulted to external APIs. Cross-region inference profiles improve availability.\n\nMarketplace partners publish agents that call Nova plus enterprise data connectors. AWS continues bundling credits to win migrations.\n\nThe battle for default enterprise model share remains fierce among cloud providers.',topic:'Industry',source:'Amazon Web Services',sourceUrl:'https://aws.amazon.com',author:'Industry Desk',publishedAt:hoursAgo(86),readTime:3},
{id:'eleuther-pythia-repro',title:'EleutherAI releases full training logs for a reproducible 7B run',summary:'Transparent checkpoints, loss curves, and data mixes give academics a rare end-to-end artifact for LLM science.',body:'EleutherAI published a fully documented 7B training run including intermediate checkpoints and exact data ordering.\n\nThe goal is scientific reproducibility rather than chasing leaderboard SOTA. Researchers can study loss spikes, batch effects, and tokenizer artifacts with shared artifacts.\n\nCompute sponsors underwrote the run on public cloud. Companion blogs walk through anomalies observed mid-training.\n\nOpen science efforts like this remain scarce as commercial secrecy increases.',topic:'Research',source:'EleutherAI',sourceUrl:'https://eleuther.ai',author:'Research Desk',publishedAt:hoursAgo(92),readTime:4},
{id:'github-copilot-workspace',title:'GitHub Copilot Workspace generalizes issue-to-PR agents for all public repos',summary:'From issue statement to draft pull request, Copilot Workspace automates planning and coding with human merge control.',body:'GitHub opened Copilot Workspace beyond preview, letting developers assign issues to an agent that proposes plans and PRs.\n\nThe agent reads repository structure, runs tests in Codespaces, and iterates on CI failures. Enterprise policies can require human approval gates.\n\nPricing folds into Copilot Enterprise seats. Early data shows higher acceptance on docs and tests than on core business logic.\n\nGitHub bets that staying inside the existing git workflow beats standalone agent products.',topic:'Tools',source:'GitHub',sourceUrl:'https://github.com',author:'Tools Desk',publishedAt:hoursAgo(98),readTime:3},
{id:'china-model-registry',title:'China\'s interim generative AI registry passes 300 approved models',summary:'Domestic filings accelerate as regulators standardize safety assessments for public-facing chatbots.',body:'Chinese regulators reported more than 300 generative AI models cleared for public release under interim rules.\n\nFilings require security assessments, content filters, and identifiable watermarks for synthetic media in many categories. Local governments compete to host AI industrial parks.\n\nExport-oriented labs navigate both domestic filings and foreign compute restrictions. Open-weight culture remains strong among Chinese researchers.\n\nThe registry is becoming a de facto map of China\'s commercial model landscape.',topic:'Policy',source:'CAC',sourceUrl:'https://www.cac.gov.cn',author:'Policy Desk',publishedAt:hoursAgo(104),readTime:4},
{id:'vllm-v1',title:'vLLM V1 engine rewrites scheduler for higher throughput on MoE models',summary:'The popular open inference stack gains a new execution engine with better prefix caching and expert parallelism.',body:'The vLLM project launched its V1 engine, redesigning the scheduler and memory manager for modern MoE and long-context workloads.\n\nThroughput gains of 1.5–2× appear on several 100B-class MoE models in community benchmarks. Prefix caching APIs stabilize for multi-turn apps.\n\nHardware backends expand across NVIDIA, AMD, and emerging accelerators. The project remains Apache-2.0 and community governed.\n\nProduction users should re-tune continuous batching parameters when upgrading.',topic:'Open Source',source:'vLLM',sourceUrl:'https://github.com/vllm-project/vllm',author:'Open Source Desk',publishedAt:hoursAgo(110),readTime:3},
{id:'scale-seal',title:'Scale AI launches SEAL leaderboards with private held-out evals',summary:'Contamination-resistant benchmarks aim to restore trust as public test sets leak into training corpora.',body:'Scale AI introduced SEAL, a suite of private evaluations for frontier models with rotating held-out sets.\n\nLabs submit APIs for blinded scoring on reasoning, coding, and domain expertise. Public leaderboards show ranks without releasing raw items.\n\nCritics note potential conflicts when Scale also sells data to the same labs. Scale says firewalls separate eval and data businesses.\n\nPrivate evals are becoming table stakes as open benchmarks saturate.',topic:'Research',source:'Scale AI',sourceUrl:'https://scale.com',author:'Research Desk',publishedAt:hoursAgo(118),readTime:3},
{id:'perplexity-shopping',title:'Perplexity expands agentic shopping with merchant checkout partnerships',summary:'Answer engine users can research and buy without leaving the chat. Publishers debate traffic and attribution impacts.',body:'Perplexity rolled out deeper shopping agents that compare products, apply coupons, and complete checkout via partner merchants.\n\nThe company argues users want outcomes, not blue links. Retailers gain high-intent traffic with affiliate-style economics.\n\nPublishers and Google watch carefully as more queries never hit traditional SERPs. Regulators may scrutinize ranking transparency.\n\nAgentic commerce is quickly becoming a major battleground for consumer AI apps.',topic:'Industry',source:'Perplexity',sourceUrl:'https://perplexity.ai',author:'Industry Desk',publishedAt:hoursAgo(126),readTime:3},
{id:'openai-deep-research',title:'ChatGPT Deep Research mode produces multi-page briefs with citations',summary:'A specialized agent browses, reads, and synthesizes sources for complex knowledge work in tens of minutes.',body:'OpenAI added Deep Research to ChatGPT, spinning up a long-running agent that gathers sources and writes structured reports.\n\nUsers specify goals and constraints; the agent returns a brief with inline citations and a trail of visited pages. Pro subscribers get higher monthly caps.\n\nKnowledge workers report strong first drafts for market scans and literature reviews, with lingering hallucination risk on niche claims.\n\nThe feature blurs lines between search, analyst tools, and document copilots.',topic:'Tools',source:'OpenAI',sourceUrl:'https://openai.com',author:'Tools Desk',publishedAt:hoursAgo(134),readTime:4},
{id:'databricks-dbrx',title:'Databricks updates DBRX MoE stack for private enterprise fine-tunes',summary:'Mosaic AI tooling adds evaluation harnesses and governance for regulated fine-tunes on customer data.',body:'Databricks refreshed its DBRX and Mosaic AI offerings with stronger evaluation and lineage tracking for enterprise fine-tunes.\n\nCustomers can run preference optimization on proprietary data without exporting it. Unity Catalog governs datasets and resulting adapters.\n\nThe pitch: keep frontier-quality assistants inside the lakehouse security boundary. Partnerships cover NVIDIA inference microservices.\n\nDatabricks competes with hyperscaler AI platforms on governance rather than raw model novelty.',topic:'Industry',source:'Databricks',sourceUrl:'https://databricks.com',author:'Industry Desk',publishedAt:hoursAgo(142),readTime:3}
];

function relativeTime(iso){const d=Date.now()-new Date(iso).getTime();const m=Math.floor(d/6e4);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';const days=Math.floor(h/24);if(days<7)return days+'d ago';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});}

const store={get(){try{return JSON.parse(localStorage.getItem('signal-bookmarks')||'[]')}catch{return[]}},set(ids){localStorage.setItem('signal-bookmarks',JSON.stringify(ids));render()},toggle(id){const cur=this.get();this.set(cur.includes(id)?cur.filter(x=>x!==id):[...cur,id])},has(id){return this.get().includes(id)}};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function route(){const h=location.hash.slice(1)||'/';if(h.startsWith('/story/'))return{name:'story',id:h.slice(7)};return{name:'home'};}

function header(count){return`<header><div class="wrap hbar"><a class="brand" href="#/"><span class="logo">◎</span><div><h1>Signal</h1><p>LLM Intelligence</p></div></a><button class="btn" id="savedBtn" type="button"><span>★</span> Saved ${count?`<span class="badge">${count}</span>`:''}</button></div></header>`;}
function footer(){return`<footer><div class="wrap" style="display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between"><p><span class="font-d" style="color:var(--ink-300);font-size:.9rem">Signal</span> — Editorial LLM &amp; AI intelligence. Seeded demo feed.</p><p style="letter-spacing:.1em;text-transform:uppercase">© ${new Date().getFullYear()} Signal Desk</p></div></footer>`;}

let state={topic:'All',q:'',saved:false};

function home(){const featured=stories.find(s=>s.featured)||stories[0];const q=state.q.trim().toLowerCase();let list=stories.filter(s=>{if(state.topic!=='All'&&s.topic!==state.topic)return false;if(state.saved&&!store.has(s.id))return false;if(!q)return true;return`${s.title} ${s.summary} ${s.source} ${s.topic}`.toLowerCase().includes(q)});
const showFeatured=!state.saved&&!q&&(state.topic==='All'||featured.topic===state.topic)&&list.some(s=>s.id===featured.id);
const feed=list.filter(s=>!(showFeatured&&s.id===featured.id));
const chips=['All',...TOPICS].map(t=>`<button class="chip ${state.topic===t?'on':''}" data-topic="${t}">${t}</button>`).join('');
return`${header(store.get().length)}
<main><div class="wrap">
<div style="border-bottom:1px solid rgba(58,65,82,.4);padding-bottom:1.1rem;margin-bottom:1.25rem">
<p class="hero-label">Daily briefing</p>
<h1 class="page-title">What moved in AI today</h1>
<p class="lede">Curated signal from labs, regulators, and the open-source frontier — dense, attribution-first, no purple gradient noise.</p>
</div>
<div class="filters">
<div class="filters-row">
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg><input type="search" id="q" placeholder="Search models, labs, policy…" value="${esc(state.q)}" /></div>
<div style="display:flex;gap:.75rem;align-items:center"><button class="btn ${state.saved?'on':''}" id="toggleSaved" type="button">${state.saved?'Saved only':'All stories'}</button><span class="meta">${list.length} results</span></div>
</div>
<div class="chips">${chips}</div>
</div>
${showFeatured?`<section class="lead"><div class="lead-grid"><div>
<div class="kicker"><span class="pill">Lead</span><span class="t">${esc(featured.topic)}</span><span>/</span><span class="s">${esc(featured.source)}</span><span>/</span><span class="s">${relativeTime(featured.publishedAt)}</span></div>
<h2><a href="#/story/${featured.id}">${esc(featured.title)}</a></h2>
<p class="sum">${esc(featured.summary)}</p>
<div class="actions"><a class="cta" href="#/story/${featured.id}">Read briefing →</a>
<button class="btn ${store.has(featured.id)?'on':''}" data-bm="${featured.id}" type="button">${store.has(featured.id)?'Saved':'Save'}</button>
<span class="meta">${featured.readTime} min read · ${esc(featured.author)}</span></div>
</div><aside class="side"><h3>Why it matters</h3><p>Frontier reasoning systems are competing on deliberate compute, not just pretraining scale — and open weights are closing the gap faster than policy can track.</p>
<dl><div><dt>Source</dt><dd>${esc(featured.source)}</dd></div><div><dt>Desk</dt><dd>${esc(featured.author)}</dd></div><div><dt>Topic</dt><dd style="color:var(--amber-dim)">${esc(featured.topic)}</dd></div><div><dt>Length</dt><dd>${featured.readTime} minutes</dd></div></dl></aside></div></section>`:''}
<section class="wire"><div class="wire-h"><h2>${state.saved?'Saved archive':'The wire'}</h2><span class="meta">${feed.length} items</span></div>
${feed.length?feed.map(s=>`<article class="card"><div class="card-body"><div class="k"><span class="t">${esc(s.topic)}</span><span>·</span><span>${esc(s.source)}</span><span>·</span><span>${relativeTime(s.publishedAt)}</span><span>·</span><span>${s.readTime} min</span></div>
<h3><a href="#/story/${s.id}">${esc(s.title)}</a></h3><p>${esc(s.summary)}</p></div>
<button class="bm ${store.has(s.id)?'on':''}" data-bm="${s.id}" type="button" aria-label="Bookmark">★</button></article>`).join(''):`<div class="empty"><h3>No stories match.</h3><p>${state.saved?'Bookmark briefings from the feed to build your archive.':'Try another topic or clear the search.'}</p></div>`}
</section></div></main>${footer()}`;}

function storyPage(id){const s=stories.find(x=>x.id===id);if(!s)return`${header(store.get().length)}<main><div class="wrap" style="padding:3rem 0"><h1 class="page-title">Story not found</h1><a class="back" href="#/">← Back to feed</a></div></main>${footer()}`;
const related=stories.filter(x=>x.topic===s.topic&&x.id!==s.id).slice(0,4);
const paras=s.body.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('');
return`${header(store.get().length)}
<main><div class="wrap detail">
<a class="back" href="#/">← Back to feed</a>
<div class="k" style="display:flex;flex-wrap:wrap;gap:.45rem;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500)"><span style="color:var(--amber-dim)">${esc(s.topic)}</span><span>·</span><span>${esc(s.source)}</span><span>·</span><span>${relativeTime(s.publishedAt)}</span><span>·</span><span>${s.readTime} min read</span></div>
<h1>${esc(s.title)}</h1>
<p class="deck">${esc(s.summary)}</p>
<div class="actions" style="border-bottom:1px solid rgba(58,65,82,.5);padding-bottom:1.25rem;margin-bottom:1.75rem">
<button class="btn ${store.has(s.id)?'on':''}" data-bm="${s.id}" type="button">${store.has(s.id)?'Saved':'Save story'}</button>
<a class="btn" href="${esc(s.sourceUrl)}" target="_blank" rel="noreferrer">Original source ↗</a>
<span class="meta">By ${esc(s.author)}</span>
</div>
<div class="body">${paras}</div>
${related.length?`<section style="margin-top:2.5rem;border-top:1px solid rgba(58,65,82,.5);padding-top:1.25rem"><h2 style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-500)">More in ${esc(s.topic)}</h2><ul style="list-style:none;padding:0;margin:1rem 0 0">${related.map(r=>`<li style="padding:.75rem 0;border-bottom:1px solid rgba(37,42,54,.8)"><a class="font-d" style="font-weight:600;font-size:.95rem" href="#/story/${r.id}">${esc(r.title)}</a><div class="meta" style="margin-top:.25rem">${esc(r.source)} · ${relativeTime(r.publishedAt)}</div></li>`).join('')}</ul></section>`:''}
</div></main>${footer()}`}

function bind(){document.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('click',()=>{state.topic=el.dataset.topic;render()}));
const q=document.getElementById('q');if(q){q.addEventListener('input',e=>{state.q=e.target.value;render();const nq=document.getElementById('q');if(nq){nq.focus();const v=nq.value;nq.setSelectionRange(v.length,v.length)}})}
const ts=document.getElementById('toggleSaved');if(ts)ts.addEventListener('click',()=>{state.saved=!state.saved;render()});
const sb=document.getElementById('savedBtn');if(sb)sb.addEventListener('click',()=>{state.saved=true;location.hash='#/';render()});
document.querySelectorAll('[data-bm]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();store.toggle(el.dataset.bm)}));}

function render(){const r=route();document.getElementById('app').innerHTML=r.name==='story'?storyPage(r.id):home();bind();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
